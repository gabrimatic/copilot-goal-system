name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the VS Code Marketplace after packaging.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm --prefix vscode-extension ci
      - run: npm run vscode:package
      - name: Require Marketplace token
        if: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required for Marketplace publishing. Add it as a repository Actions secret."
            exit 1
          fi
      - name: Publish Marketplace extension
        if: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          version="$(node -p "require('./vscode-extension/package.json').version")"
          npm --prefix vscode-extension exec vsce -- publish --packagePath "dist/copilot-goal-system-${version}.vsix"
      - name: Package-only dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'false' }}
        run: echo "Packaged extension without publishing because publish=false."
