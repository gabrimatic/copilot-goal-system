name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the VS Code Marketplace after packaging.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm ci
      - run: npm run verify
      - run: npm --prefix vscode-extension ci
      - run: npm run vscode:package
      - name: Require Marketplace token
        if: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required for Marketplace publishing. Add it as a repository Actions secret."
            exit 1
          fi
      - name: Publish Marketplace extension
        if: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -o pipefail

          version="$(node -p "require('./vscode-extension/package.json').version")"
          package_path="dist/copilot-goal-system-${version}.vsix"
          extension_id="gabrimatic.copilot-goal-system"
          delays=(30 90 180)

          marketplace_has_version() {
            timeout 60s npm --prefix vscode-extension exec vsce -- show "$extension_id" --json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); const latest=j.versions?.[0]?.version || j.version || ''; process.exit(latest === process.argv[1] ? 0 : 1);})" "$version"
          }

          for attempt in 1 2 3 4; do
            echo "Publishing $extension_id v$version (attempt $attempt/4)..."
            if timeout 240s npm --prefix vscode-extension exec vsce -- publish --packagePath "$package_path"; then
              echo "Publish command completed."
              break
            fi

            if marketplace_has_version; then
              echo "Marketplace already shows v$version after a publish error."
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Marketplace publish failed after $attempt attempts."
              exit 1
            fi

            delay="${delays[$((attempt - 1))]}"
            echo "Publish failed and Marketplace does not show v$version yet; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Verify Marketplace version
        if: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          set -o pipefail

          version="$(node -p "require('./vscode-extension/package.json').version")"
          extension_id="gabrimatic.copilot-goal-system"

          for attempt in $(seq 1 20); do
            current="$(timeout 60s npm --prefix vscode-extension exec vsce -- show "$extension_id" --json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); console.log(j.versions?.[0]?.version || j.version || '');})")"

            if [ "$current" = "$version" ]; then
              echo "Marketplace shows $extension_id v$version."
              exit 0
            fi

            echo "Marketplace shows v${current:-unknown}; waiting for v$version ($attempt/20)."
            sleep 15
          done

          echo "Marketplace did not show $extension_id v$version after publish."
          exit 1
      - name: Package-only dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'false' }}
        run: echo "Packaged extension without publishing because publish=false."
